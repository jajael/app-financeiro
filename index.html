<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    
    <!-- CSS - Modular (carregado em ordem de dependência) -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/tabs.css">
    <link rel="stylesheet" href="css/transactions.css">
    <link rel="stylesheet" href="css/charts.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/menus.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>💰 Controle Financeiro</h1>
                <div class="header-info">
                    <span class="month-selector">
                        <button id="prevMonth" class="month-btn">←</button>
                        <span id="currentMonth" class="current-month">Setembro 2026</span>
                        <button id="nextMonth" class="month-btn">→</button>
                    </span>
                    <button id="btnLogout" class="month-btn" hidden title="Sair">⎋ Sair</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Dashboard Summary -->
            <section class="dashboard">
                <div class="summary-card entradas">
                    <h3>💰 Receitas</h3>
                    <p class="amount" id="totalEntradas">R$ 0,00</p>
                </div>
                <div class="summary-card saidas">
                    <h3>💸 Despesas</h3>
                    <p class="amount" id="totalSaidas">R$ 0,00</p>
                </div>
                <div class="summary-card balanco">
                    <h3>📊 Balanço</h3>
                    <p class="amount" id="balanco">R$ 0,00</p>
                </div>
            </section>

            <!-- Tabs Navigation -->
            <section class="tabs">
                <button class="tab-btn active" data-tab="entradas">📥 Receitas</button>
                <button class="tab-btn" data-tab="saidas">📤 Despesas</button>
                <button class="tab-btn" data-tab="proximas">⏰ Próximas</button>
                <button class="tab-btn" data-tab="adicionar">➕ Lançamento</button>
                <button class="tab-btn" data-tab="menus">⚙️ Configuração</button>
            </section>

            <!-- Tab: Entradas -->
            <section id="entradas" class="tab-content active">
                <div class="transacoes-container">
                    <h2>Receitas do Mês</h2>
                    <div id="entradasLista" class="transacoes-lista">
                        <!-- Entradas serão listadas aqui -->
                    </div>
                </div>
            </section>

            <!-- Tab: Saídas -->
            <section id="saidas" class="tab-content">
                <div class="transacoes-container">
                    <h2>Despesas do Mês</h2>
                    <div id="saidasLista" class="transacoes-lista">
                        <!-- Saídas serão listadas aqui -->
                    </div>
                </div>
                
                <div class="analise-container" style="margin-top: 2rem;">
                    <h3>Análise por Categoria</h3>
                    <div id="categoriesList" class="categories-list">
                        <!-- Análise por categoria -->
                    </div>
                </div>
            </section>

            <!-- Tab: Próximas Transações -->
            <section id="proximas" class="tab-content">
                <div class="proximas-container">
                    <h2>Próximas Transações (30 dias)</h2>
                    <div id="proximasLista" class="transacoes-lista">
                        <!-- Próximas transações -->
                    </div>
                </div>
            </section>

            <!-- Tab: Adicionar Lançamento -->
            <section id="adicionar" class="tab-content">
                <form id="formTransacao" class="form-transacao">
                    <div class="form-header">
                        <h2>Adicionar Lançamento</h2>
                        <div class="tipo-selector">
                            <button type="button" class="tipo-btn active" data-tipo="entradas">
                                📥 Receita
                            </button>
                            <button type="button" class="tipo-btn" data-tipo="saidas">
                                📤 Despesa
                            </button>
                        </div>
                    </div>
                    
                    <input type="hidden" id="tipoTransacao" value="entradas">

                    <!-- 1) Recorrência e derivados -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tipoRecorrencia">Recorrência:</label>
                            <select id="tipoRecorrencia" required></select>
                        </div>
                        <div class="form-group" id="diaRecorrenciaGroup" hidden>
                            <label for="diaRecorrencia">Dia de vencimento:</label>
                            <input type="text" id="diaRecorrencia" inputmode="numeric" maxlength="2" placeholder="dia" autocomplete="off">
                            <label class="inline-check"><input type="checkbox" id="pagarVencimento"> <span id="pagarVencimentoLabel">pagar no vencimento</span></label>
                        </div>
                        <div class="form-group" id="parceleGroup" hidden>
                            <label for="parcelas">Parcelas:</label>
                            <input type="number" id="parcelas" min="1" max="48" value="1">
                        </div>
                        <div class="form-group" id="diaSemanaGroup" hidden>
                            <label for="diaSemana">Dia da semana:</label>
                            <select id="diaSemana">
                                <option value="">Sem dia fixo</option>
                                <option value="0">Domingo</option>
                                <option value="1">Segunda</option>
                                <option value="2">Terça</option>
                                <option value="3">Quarta</option>
                                <option value="4">Quinta</option>
                                <option value="5">Sexta</option>
                                <option value="6">Sábado</option>
                            </select>
                        </div>
                        <div class="form-group" id="dataCalculadaGroup" hidden>
                            <label for="dataCalculada">Data (automática):</label>
                            <input type="text" id="dataCalculada" class="campo-travado" readonly tabindex="-1">
                        </div>
                    </div>
                    <div class="form-row" id="semanasChipsRow" hidden>
                        <div class="form-group full-width" id="semanasChipsGroup">
                            <label>Semanas do mês <span class="hint-inline">(o valor é por sessão)</span>:</label>
                            <div id="semanasChips" class="semanas-chips"></div>
                            <div id="semanasResumo" class="semanas-resumo"></div>
                        </div>
                    </div>

                    <!-- 2) Data e valor -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="data">Data:</label>
                            <input type="text" id="data" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" autocomplete="off" required>
                        </div>
                        <div class="form-group">
                            <label for="valor">Valor:</label>
                            <input type="number" id="valor" step="0.01" placeholder="0,00" required>
                        </div>
                    </div>

                    <!-- 3) Método e categoria -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="metodo">Método:</label>
                            <select id="metodo" required>
                                <option value="">Selecione...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="categoria">Categoria:</label>
                            <select id="categoria" required>
                                <option value="">-- Selecione uma categoria --</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row" id="competenciaGroup" hidden>
                        <div class="form-group">
                            <label for="competencia">Competência:</label>
                            <input type="text" id="competencia" inputmode="numeric" placeholder="mm/aaaa" maxlength="7" autocomplete="off">
                        </div>
                    </div>

                    <!-- 4) Descrição -->
                    <div class="form-group full-width">
                        <label for="descricao">Descrição (opcional):</label>
                        <input type="text" id="descricao" placeholder="Ex: Compra no mercado, Aluguel, etc">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit">Adicionar Lançamento</button>
                        <button type="button" id="cancelarEdicao" class="btn-cancelar" hidden>Cancelar</button>
                    </div>
                </form>
            </section>

            <!-- Tab: Gerenciar Menus -->
            <section id="menus" class="tab-content">
                <div id="menusContainer" class="menus-container">
                    <p class="loading">Carregando menus...</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>App Financeiro v2.0 | Desenvolvido com ❤️</p>
        </footer>
    </div>

    <!-- Supabase (banco de dados) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/state.js"></script>
    <script src="js/recorrencia.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/menus-api.js"></script>
    <script src="js/menus-ui.js"></script>
    <script src="js/events.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
